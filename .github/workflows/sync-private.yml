name: RC11 sync private source into public GAS
# Canonical private-main sync; safe manual kick after RC11 PR92 merge (no new behavior).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-private.yml'
      - 'scripts/import-private-export.mjs'
  schedule:
    - cron: '17,47 * * * *'

permissions:
  contents: write

concurrency:
  group: rc11-private-to-public-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      changed: ${{ steps.publish.outputs.changed }}
      published_sha: ${{ steps.publish.outputs.published_sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check read-only private source credential
        id: credential
        env:
          RC11_PRIVATE_READ_TOKEN: ${{ secrets.RC11_PRIVATE_READ_TOKEN }}
        run: |
          if [ -z "$RC11_PRIVATE_READ_TOKEN" ]; then
            echo 'Private source credential not configured; no publishing or deployment.'
            echo 'skip=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Checkout private RC11 source (never published)
        if: steps.credential.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: yuzukisumabura0920-commits/rc11-next
          ref: main
          token: ${{ secrets.RC11_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: .private-rc11-build
      - name: Build latest private GAS source without npm lifecycle scripts
        if: steps.credential.outputs.skip != 'true'
        working-directory: .private-rc11-build
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run gas:dry-run
          node tools/export-gas-txt.mjs
      - name: Import only generated Code.gs and appsscript.json
        if: steps.credential.outputs.skip != 'true'
        run: |
          node scripts/import-private-export.mjs .private-rc11-build/exports/RC11_NEXT_GAS_ALL_SOURCE.txt
          node scripts/check-source.mjs
      - name: Commit public files only when validated source changes
        if: steps.credential.outputs.skip != 'true'
        id: publish
        shell: bash
        run: |
          git add -- Code.gs appsscript.json
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'No deployable GAS changes.'
          else
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'Sync validated RC11 GAS source from private main'
            git push origin HEAD:main
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            echo "published_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      source_sha: ${{ needs.sync.outputs.published_sha }}
    secrets: inherit
